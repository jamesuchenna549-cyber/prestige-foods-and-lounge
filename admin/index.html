<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="admin.css">

<title>Admin Login</title>

</head><body><div class="admin-login-container">

    <h1>Admin Login</h1>

    <p>Login to access the admin panel.</p>

    <form class="admin-login-form">

        <div class="form-group">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>

        <p class="admin-login-message"></p>

        <button type="submit">
            Login
        </button>

    </form>

</div>

<script src="admin.js" defer></script>

</body>

</html>
