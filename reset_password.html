<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
<link
    rel="stylesheet"
    href="style/password_reset.css"
>

    <title>Reset Password</title>

</head>

<body>

    <div class="reset-password-container">

        <h1>Reset Your Password</h1>

        <p>
            Enter your new password below.
        </p>

        <form id="reset-password-form">

            <div class="form-group">

                <input
                    type="password"
                    id="new-password"
                    name="password"
                    placeholder="Enter your new password"
                    required
                >

            </div>


            <div class="form-group">

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your new password"
                    required
                >

            </div>


            <button
                type="submit"
                id="reset-password-button"
            >
                Change Password
            </button>

        </form>


        <p
            id="reset-message"
            class="message"
        ></p>


        <a href="index.html">
            Back to Login
        </a>

    </div>


    <script
        type="module"
        src="js/14-reset_password.js"
    ></script>

</body>

</html>
