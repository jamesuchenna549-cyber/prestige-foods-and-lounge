<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful</title>

    <link
        rel="stylesheet"
        href="style/order-success.css"
    >

</head>


<body>

<div class="order-success-container">

    <div class="success-icon">
        ✓
    </div>

    <h1>
        Your Order Has Been Placed!
    </h1>

    <p class="thank-you">
        Thank you for ordering from Prestige Foods & Lounge.
    </p>

    <p class="order-number"></p>

    <p class="order-status"></p>

    <p class="payment-status"></p>

    <div class="order-section">

        <h2>
            Your Order
        </h2>

        <div class="order-items-container"></div>

        <div class="order-total">

            <span>
                Total
            </span>

            <strong class="total-price">
                ₦0
            </strong>

        </div>

    </div>

    <button
        class="make-payment-btn"
        id="make-payment-btn"
    >
        Pay for This Order
    </button>

    <a
        href="01-shop.html"
        class="continue-shopping"
    >
        Continue Shopping
    </a>

</div>

    <script
        type="module"
        src="js/12-order-success.js"
    ></script>


</body>

</html>
