<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
<link
    rel="stylesheet"
    href="style/password_reset.css"
>


    <title>Forgot Password</title>

</head>

<body>

    <div class="forgot-password-container">

        <h1>Forgot Your Password?</h1>

        <p>
            Enter the email address associated with your account.
        </p>

        <form id="forgot-password-form">

            <div class="form-group">

                <input
                    type="email"
                    id="forgot-email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <button
                type="submit"
                id="reset-button"
            >
                Send Reset Link
            </button>

        </form>

        <p
            id="forgot-message"
            class="message"
        ></p>

        <a href="index.html">
            Back to Login
        </a>

    </div>


    <script
        type="module"
        src="js/13-forgot_password.js"
    ></script>

</body>

</html>
